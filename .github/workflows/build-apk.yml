name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Call Recorder v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 📱 Call Recorder App - Silent Background Call Recorder
            - **Silent Recording**: Automatically records calls without beeps or loud notifications.
            - **Direct MP3 Storage**: Saves files to `/sdcard/Music/CallRecordings/`.
            - **Metadata Storage**: Retains phone numbers, contact names, durations, and timestamps.
            - **Built-in Player**: Play, pause, and seek recordings in Jetpack Compose UI.

            #### 📥 Download
            Download the APK below to install on your Android device (Android 12+ / API 31+).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
